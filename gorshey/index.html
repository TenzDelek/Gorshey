<title>Gorshey Circle</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tibetan:wght@500;700&family=Silkscreen&family=Young+Serif&display=swap">
<style>
  /* Layout: one full-bleed diorama; a quiet caption bottom-left, two pixel-type controls bottom-right. */
  :root {
    --bg: #fbfbf8;          /* paper the diorama sits on (matches scene day bg) */
    --fg: #23201d;          /* ink */
    --muted: #77716a;       /* captions */
    --accent: #8b1e2d;      /* chuba maroon */
    --line: rgba(35, 32, 29, 0.16);
    --chip: rgba(251, 251, 248, 0.82);
    --font-display: "Young Serif", "Iowan Old Style", Georgia, serif;
    --font-tibetan: "Noto Serif Tibetan", "Kailasa", "Microsoft Himalaya", serif;
    --font-pixel: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1220; --fg: #ece6da; --muted: #8e93a6; --accent: #f0a24a;
      --line: rgba(236, 230, 218, 0.18); --chip: rgba(14, 18, 32, 0.78); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1220; --fg: #ece6da; --muted: #8e93a6; --accent: #f0a24a;
    --line: rgba(236, 230, 218, 0.18); --chip: rgba(14, 18, 32, 0.78); color-scheme: dark;
  }
  /* The scene's own day/night (the toggle can override the theme) keeps the page in step. */
  :root[data-scene="day"] {
    --bg: #fbfbf8; --fg: #23201d; --muted: #77716a; --accent: #8b1e2d;
    --line: rgba(35, 32, 29, 0.16); --chip: rgba(251, 251, 248, 0.82);
  }
  :root[data-scene="night"] {
    --bg: #0e1220; --fg: #ece6da; --muted: #8e93a6; --accent: #f0a24a;
    --line: rgba(236, 230, 218, 0.18); --chip: rgba(14, 18, 32, 0.78);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: background-color 0.6s ease, color 0.6s ease;
    overflow: hidden;
  }
  .stage { position: relative; height: 100%; width: 100%; overflow: hidden; }
  #scene {
    display: block; position: absolute; inset: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: grab; touch-action: pan-y; outline: none;
  }
  #scene.dragging { cursor: grabbing; }
  #scene:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

  .overlay {
    position: absolute; inset: auto 0 0 0;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 max(18px, env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .caption { display: grid; gap: 6px; min-width: 0; }
  .eyebrow {
    font-family: var(--font-pixel); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  .name { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0; }
  .name .latin { font-family: var(--font-display); font-size: clamp(26px, 4.2vw, 40px); line-height: 1; letter-spacing: -0.01em; text-wrap: balance; }
  .name .bod { font-family: var(--font-tibetan); font-weight: 700; font-size: clamp(20px, 3vw, 28px); line-height: 1.2; color: var(--accent); }
  .note { margin: 0; max-width: 38ch; font-size: 13px; line-height: 1.45; color: var(--muted); }

  .controls { display: flex; gap: 8px; pointer-events: auto; }
  .controls button {
    font-family: var(--font-pixel); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 0;
    padding: 9px 12px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .controls button:hover { border-color: var(--fg); }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls .dot { width: 8px; height: 8px; background: var(--accent); display: inline-block; }

  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-pixel); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  html.ready .loading { display: none; }
  html.clean .overlay, html.clean .loading { display: none; }
  #errors {
    position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    margin: 0; padding: 8px 10px; max-width: calc(100% - 32px); overflow-x: auto;
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #fff; background: #a3242a; white-space: pre-wrap;
  }
  @media (max-width: 520px) {
    .note { display: none; }
    .overlay { align-items: flex-start; flex-direction: column; }
  }
</style>

<div class="stage">
  <canvas id="scene" tabindex="0" aria-label="Animated pixel diorama: twelve dancers in chuba circle a bonfire on the Tibetan grassland while a musician plays the dranyen beside a white picnic tent and prayer flags. Drag or use the arrow keys to turn it."></canvas>
  <div class="loading">Lighting the fire…</div>
  <pre id="errors" hidden></pre>
  <div class="overlay">
    <div class="caption">
      <p class="eyebrow">Tibetan circle dance</p>
      <h1 class="name"><span class="latin">Gorshey</span><span class="bod" lang="bo">སྒོར་གཞས།</span></h1>
      <p class="note">Dancers in chuba step and swing their sleeves around the fire while the dranyen plays. Drag to turn the circle.</p>
    </div>
    <div class="controls">
      <button id="toggle-night" type="button"><span class="dot" aria-hidden="true"></span>Day / Night</button>
      <button id="toggle-play" type="button" aria-pressed="true"><span>Pause</span></button>
    </div>
  </div>
</div>

<script type="importmap">
